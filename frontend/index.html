<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not-lify</title>
    <meta key="title" content="Not-lify" property="og:title" />
    <meta
      content="Your second brain for organizing thoughts and ideas."
      property="og:description"
    />
    <meta
      content="Your second brain for organizing thoughts and ideas."
      name="description"
    />
    <meta
      key="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
      name="viewport"
    />
    <link href="/favicon.ico" rel="icon" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("app:theme") || "light";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          var fs = { sm: "0.875rem", md: "1rem", lg: "1.125rem" };
          document.documentElement.style.setProperty("--editor-font-size", fs[localStorage.getItem("app:fontSize")] || "1rem");
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
